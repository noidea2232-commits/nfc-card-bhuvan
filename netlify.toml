[build]
  publish = "dist"
  command = "npm run build"

# Dynamic Card Resolver - Proxies /c/:token to Vercel Serverless API
[[redirects]]
  from = "/c/:token"
  to = "https://nfc-card-bhuvan.vercel.app/c/:token"
  status = 302
  force = true

# Single Page Application (SPA) catch-all routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
